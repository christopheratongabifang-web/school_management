{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 600px;">
    <h2>Edit User: {{ user.username }}</h2>
    <p style="color: var(--gray); margin-bottom: 2rem;">Modify user information below</p>

    <form method="POST" action="">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" value="{{ user.username }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ user.email }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Role</label>
            <select name="role" class="form-control" required>
                <option value="SUPER_ADMIN" {% if user.role == 'SUPER_ADMIN' %}selected{% endif %}>Super Admin</option>
                <option value="PRINCIPAL" {% if user.role == 'PRINCIPAL' %}selected{% endif %}>Principal</option>
                <option value="BURSER" {% if user.role == 'BURSER' %}selected{% endif %}>Burser</option>
                <option value="ACCOUNTANT" {% if user.role == 'ACCOUNTANT' %}selected{% endif %}>Accountant</option>
                <option value="SECRETARY" {% if user.role == 'SECRETARY' %}selected{% endif %}>Secretary</option>
            </select>
        </div>

        <div class="form-group">
            <label>New Password (Optional)</label>
            <div class="password-wrapper">
                <input type="password" name="new_password" class="form-control" placeholder="Leave blank to keep current password" id="new_password">
                <i class="fas fa-eye toggle-password" id="password_eye" onclick="togglePassword('new_password', 'password_eye')"></i>
            </div>
            <small style="color: var(--gray);">Min 6 chars if changing password</small>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
            <a href="{{ url_for('manage_users') }}" class="btn btn-secondary" style="flex: 1; text-align: center; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
